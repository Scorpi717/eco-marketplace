<meta charset="UTF-8">

<title>EcoPlaza - Sustainable Marketplace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

:root {
  --bg-main: #f8faf7;
  --bg-card: #ffffff;
  --primary: #1e5e3a;
  --primary-light: #eef7f2;
  --text-main: #1a241e;
  --text-muted: #606f66;
  --border: #e2e9e4;
  --shadow: rgba(28, 54, 38, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 2rem 1rem;
}

.market {
  max-width: 1200px;
  margin: 0 auto;
}

.market-header {
  text-align: center;
  margin-bottom: 2.5rem;
}

.market-logo {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.market-logo span {
  font-style: italic;
  font-weight: 400;
  color: #388e5a;
}

.market-sub {
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

/* Enhanced Filters */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 2.5rem;
}

.filter-btn {
  padding: 8px 18px;
  border-radius: 30px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 2px 4px var(--shadow);
}

.filter-btn.active, .filter-btn:hover {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(30, 94, 58, 0.15);
}

/* Premium Grid Elements */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 12px var(--shadow);
}

.card:hover {
  transform: translateY(-4px);
  border-color: #bcd4c4;
  box-shadow: 0 12px 24px rgba(28, 54, 38, 0.08);
}

.card-img {
  width: 100%;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #f4f8f5 0%, #eef5f0 100%);
  font-size: 52px;
  border-bottom: 1px solid var(--border);
}

.card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.card-brand {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.75px;
  font-weight: 700;
  color: #388e5a;
  margin-bottom: 4px;
}

.card-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.4;
  margin-bottom: 8px;
  min-height: 40px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-price {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 12px;
}

.card-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.esg {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  color: #fff;
  letter-spacing: 0.2px;
}
.esg-high { background: #2a7e4b; }
.esg-mid { background: #d97706; }

.badge-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
}
.badge-org { background: #e8f5e9; color: #1e5e3a; }
.badge-fair { background: #fff8e1; color: #b45309; }
.badge-bio { background: #e3f2fd; color: #1d4ed8; }
.badge-eco { background: #f3e5f5; color: #6b21a8; }

/* Modern Button Actions */
.btn-link {
  display: block;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  transition: all 0.2s ease;
  text-align: center;
  text-decoration: none;
  margin-top: auto;
  letter-spacing: 0.2px;
}

.btn-ah { background: #00a1e4; color: #fff; }
.btn-ah:hover { background: #0082ba; }

.btn-bol { background: #0000ff; color: #fff; }
.btn-bol:hover { background: #0000cd; }

.btn-picnic { background: #e30613; color: #fff; }
.btn-picnic:hover { background: #b8050f; }

.btn-eko { background: #6cb33f; color: #fff; }
.btn-eko:hover { background: #538b2f; }
</style>

function filterBy(brand,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(brand==='all'?products:products.filter(p=>p.brand===brand));
}

function renderGrid(list){
  const g=document.getElementById('grid');
  g.innerHTML=list.map(p=>`
    <div class="card">
      <div class="card-img">${p.icon}</div>
      <div class="card-body">
        <div class="card-brand">${p.brand}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">${p.price}</div>
        <div class="card-badges">
          <span class="esg ${p.esgLevel==='high'?'esg-high':'esg-mid'}">ESG: ${p.esg}</span>
          <span class="badge-tag ${p.badge}">${p.badgeText}</span>
        </div>
        <a href="${p.url}" target="_blank" rel="noopener" class="btn-link ${p.shopClass}">
          View at ${p.shop}
        </a>
      </div>
    </div>
  `).join('');
}
renderGrid(products);
